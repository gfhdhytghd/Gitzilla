<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gitzilla Boss Gallery</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #08060d; color: #cfc6e6; font: 12px ui-monospace, monospace; }
  h2 { margin: 8px 12px 4px; font-size: 12px; color: #8bffb0; font-weight: normal; }
  canvas { image-rendering: pixelated; display: block; }
  #wrap { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 12px; }
  .cell { position: relative; }
  .cell span { position: absolute; left: 4px; top: 2px; color: #fff; background: #0008; padding: 0 3px; font-size: 11px; }
  #nav { margin: 4px 12px; }
  #nav a { color: #9ad; margin-right: 10px; }
</style>
</head>
<body>
<h2 id="title">$ gitzilla --boss-gallery</h2>
<div id="nav"></div>
<div id="wrap"></div>
<script type="module" src="./gallery.ts"></script>
</body>
</html>
