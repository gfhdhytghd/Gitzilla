<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Gitzilla 3D Stage</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #05030a; color: #cfc6e6; font: 12px ui-monospace, monospace; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; display: block; }
  #hud { position: fixed; left: 8px; top: 6px; z-index: 2; background: #000a; padding: 2px 6px; white-space: pre; }
  #nav { position: fixed; left: 8px; bottom: 6px; z-index: 2; }
  #nav a { color: #9ad; margin-right: 8px; }
  #enter { position: fixed; right: 8px; top: 6px; z-index: 3; display: none; background: #0d1117; color: #2ee6c8; border: 1px solid #2ee6c8; padding: 6px 10px; font: inherit; }
</style>
</head>
<body>
<div id="wrap"></div>
<div id="hud">$ gitzilla --stage3d</div>
<div id="nav"></div>
<button id="enter" data-testid="enter-xr">Enter Vision Pro</button>
<script type="module" src="./gallery.ts"></script>
</body>
</html>
