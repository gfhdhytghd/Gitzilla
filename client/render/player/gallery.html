<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hero Gallery</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0d0a14; color: #cfc6e6; font: 13px ui-monospace, monospace; }
  h2 { margin: 10px 14px 6px; font-size: 13px; color: #8bffb0; font-weight: normal; }
  #stage { display: block; image-rendering: pixelated; margin: 0 14px; }
  #portraits { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 14px 20px; }
  .card { background: #1a1428; border: 2px solid #2d2442; padding: 6px; text-align: center; width: 104px; }
  .card canvas { image-rendering: pixelated; display: block; margin: 0 auto; }
  .card div { font-size: 10px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<h2>$ kaiju --heroes  // 24 procedural heroes: all weapons, skills &amp; states</h2>
<canvas id="stage"></canvas>
<h2>$ kaiju --portraits</h2>
<div id="portraits"></div>
<script type="module" src="./gallery.ts"></script>
</body>
</html>
